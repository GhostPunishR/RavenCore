name: Release
# Publishes the GitHub release of a vX.Y.Z tag. The notes are that version's
# section of CHANGELOG.md; the Linux x86-64 Libretro cores are attached.
# Third-party actions are pinned to a full commit SHA (tag in the comment).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z), created on the selected branch head if missing
        required: true

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the version and extract the release notes
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not vX.Y.Z"; exit 1
          fi
          version="${TAG#v}"
          if ! grep -Fq "project(RavenEmuCores VERSION $version " CMakeLists.txt; then
            echo "CMakeLists.txt does not declare version $version"; exit 1
          fi
          # Lines between "## X.Y.Z - date" and the next second-level heading.
          awk -v heading="## $version " '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Package Libretro cores and RetroArch information
        run: |
          mkdir -p dist/cores dist/info
          cp build/libretro/*_libretro.so dist/cores/
          cp build/libretro/info/*_libretro.info dist/info/
          tar -C dist -czf "ravenemu-libretro-$TAG-linux-x86_64.tar.gz" cores info
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" "ravenemu-libretro-$TAG-linux-x86_64.tar.gz"
          --title "RavenEmu Cores ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          --target "$GITHUB_SHA"
