name: Release
# Publishes the GitHub release of a vX.Y.Z tag. The notes are that version's
# section of CHANGELOG.md; the Libretro cores are attached for Linux x86-64,
# Windows x86-64, macOS (arm64 and x86-64) and Android (arm64-v8a, armeabi-v7a).
# Third-party actions are pinned to a full commit SHA (tag in the comment).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z); an existing tag is built from its own commit, a missing one is created on the selected branch head
        required: true

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  notes:
    name: Check the version and extract the release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The one commit every job builds and the release points to.
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve the commit to publish
        id: source
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not vX.Y.Z"; exit 1
          fi
          # A tag that already exists is published from its own commit, whatever
          # branch the run was started on; a missing one is created on the
          # selected commit. Any other failure to ask the remote stops here.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            sha=$(git rev-parse "refs/tags/$TAG^{commit}")
            git checkout --detach "$sha"
          else
            status=$?
            if [ "$status" != 2 ]; then exit "$status"; fi
            sha="$GITHUB_SHA"
          fi
          echo "Publishing $TAG from $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check the version and extract the release notes
        run: |
          version="${TAG#v}"
          if ! grep -Fq "project(RavenCore VERSION $version " CMakeLists.txt; then
            echo "CMakeLists.txt does not declare version $version"; exit 1
          fi
          # Lines between "## X.Y.Z - date" and the next second-level heading.
          mkdir -p notes
          awk -v heading="## $version " '
            /^## / { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes/notes.md

  cores:
    name: Libretro cores (${{ matrix.platform }})
    needs: notes
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
          - platform: macos-universal
            os: macos-latest
          - platform: android-arm64-v8a
            os: ubuntu-latest
            abi: arm64-v8a
          - platform: android-armeabi-v7a
            os: ubuntu-latest
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - name: Configure CMake
        env:
          PLATFORM: ${{ matrix.platform }}
          ABI: ${{ matrix.abi }}
        run: |
          case "$PLATFORM" in
            linux-*) cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ;;
            # The C++ runtime is linked in: no Visual C++ redistributable needed.
            windows-*) cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ;;
            macos-*)
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
                "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ;;
            android-*)
              ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
              test -n "$ndk" || { echo "No Android NDK on this runner"; exit 1; }
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                "-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake" \
                "-DANDROID_ABI=$ABI" -DANDROID_PLATFORM=android-24 ;;
          esac
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        # Android cores are cross-compiled: nothing runs on the runner.
        if: ${{ !startsWith(matrix.platform, 'android-') }}
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Libretro cores and RetroArch information
        env:
          PLATFORM: ${{ matrix.platform }}
        run: libretro/package.sh build "$PLATFORM" "ravenemu-libretro-$TAG-$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cores-${{ matrix.platform }}
          path: ravenemu-libretro-*

  publish:
    name: Publish GitHub release
    needs: [notes, cores]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.notes.outputs.sha }}
        run: >
          gh release create "$TAG" artifacts/cores-*/ravenemu-libretro-*
          --repo "$GITHUB_REPOSITORY"
          --title "RavenCore ${TAG#v}" --notes-file artifacts/release-notes/notes.md
          --target "$SHA"
